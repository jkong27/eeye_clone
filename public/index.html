<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eschaton Eye</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">STARBREAK · ESCHATON ARCHIVE</p>
        <h1>Read the<br><span>signal.</span></h1>
        <p class="intro">Browse the latest public lobby chat or look up a player’s history.</p>
      </header>

      <nav class="tabs" role="tablist" aria-label="Chat archive views">
        <button id="recent-tab" class="tab" type="button" role="tab"
          aria-selected="true" aria-controls="recent-view" data-view="recent">
          HOME
        </button>
        <button id="lookup-tab" class="tab" type="button" role="tab"
          aria-selected="false" aria-controls="lookup-view" data-view="lookup" tabindex="-1">
          PLAYER LOOKUP
        </button>
      </nav>

      <section id="recent-view" class="view" role="tabpanel" aria-labelledby="recent-tab">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">LIVE ARCHIVE</p>
            <h2>Recent transmissions</h2>
          </div>
          <p class="count">LATEST 100</p>
        </div>
        <p id="recent-status" class="view-status" role="status">Loading recent messages…</p>
        <div id="recent-messages" class="messages" aria-live="polite"></div>
      </section>

      <section id="lookup-view" class="view" role="tabpanel" aria-labelledby="lookup-tab" hidden>
        <div class="search-panel" aria-label="Player search">
          <label for="search">PLAYER LOOKUP</label>
          <div class="search-row">
            <input id="search" type="search" autocomplete="off" placeholder="Name or player ID">
            <button id="search-button" type="button">SEARCH</button>
          </div>
          <p id="status" role="status">Enter a player name to begin.</p>
          <div id="players" class="players" aria-live="polite"></div>
        </div>

        <section id="history" class="history" hidden>
          <div class="history-heading">
            <div>
              <p class="eyebrow">TRANSMISSION LOG</p>
              <h2 id="player-name"></h2>
              <p id="player-id" class="player-id"></p>
            </div>
            <p id="message-count" class="count"></p>
          </div>
          <div id="messages" class="messages"></div>
          <button id="load-more" class="load-more" type="button" hidden>LOAD EARLIER</button>
        </section>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
